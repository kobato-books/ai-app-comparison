<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ほしのアトリエ — 小さな星座づくり</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090f23;color:#e8efff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:38px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{color:#a1b6e8;letter-spacing:.22em;font-size:12px}h1{font-size:clamp(28px,5vw,44px);font-weight:600;letter-spacing:.06em;margin:10px 0}header p{color:#b0bdd9;font-size:14px;line-height:1.8}.moon{font-size:48px;color:#ffe4a0}section{border:1px solid #2b3856;border-radius:22px;overflow:hidden;margin-top:22px;background:#111b33}.bar{display:flex;align-items:center;gap:12px;padding:18px 22px;flex-wrap:wrap}.bar label{font-size:12px;color:#aebddd}input{color:#ffe6ab;background:transparent;border:0;border-bottom:1px solid #43506c;font:inherit;font-size:18px;padding:6px;max-width:220px;width:100%}input:focus{outline:2px solid #bcd1ff;outline-offset:3px}.count{margin-left:auto;font-size:12px;color:#aebddd}canvas{width:100%;height:440px;display:block;touch-action:none;cursor:crosshair;background:#0d162d}button{border:1px solid #425376;background:#1c2c49;color:#e6efff;border-radius:12px;padding:12px 18px;font:inherit;font-size:14px;cursor:pointer}button:hover{background:#304469}button:focus-visible{outline:3px solid #ffe4a0}button:disabled{opacity:.4;cursor:default}.primary{background:#ffe2a0;color:#202638;border-color:#ffe2a0;margin-left:auto}.primary:hover{background:#ffedc6}footer{color:#899bbf;font-size:12px;line-height:1.8;margin-top:18px}.tip{color:#c9d7f3;font-size:13px}#status{min-height:22px;color:#ffe4a0;font-size:13px}@media(max-width:600px){main{padding:24px 14px}canvas{height:410px}.bar{padding:14px;gap:8px}button{padding:12px}.primary{margin-left:0}header p{max-width:270px}.moon{display:none}.count{margin-left:0;width:100%}}
</style>
<main><header><div><div class="eyebrow">YOUR LITTLE NIGHT SKY</div><h1>ほしのアトリエ</h1><p>まだ名前のない星座を、あなたの手で。<br>夜空をタップすると、星がひとつ生まれます。</p></div><div class="moon" aria-hidden="true">☾</div></header>
<section><div class="bar"><label for="name">星座の名前</label><input id="name" maxlength="24" value="わたしの星座" aria-label="星座の名前"><span class="count" id="count">0 個の星</span></div><canvas id="sky" aria-label="タップして星を置く夜空。下の「おまかせ」でも星座を作れます。"></canvas><div class="bar"><button id="undo" disabled>ひとつ戻す</button><button id="random">✧ おまかせ</button><button id="clear" disabled>新しい夜空</button><button class="primary" id="save" disabled>画像にして保存 ↗</button></div></section>
<footer><div class="tip">星は置いた順につながります。好きな形も、ちょっとへんな形も、あなたの星座。</div><div id="status" role="status" aria-live="polite"></div>作品はこのブラウザに自動保存。通信なしで遊べます。</footer></main>
<script>
(()=>{'use strict';const c=document.querySelector('#sky'),ctx=c.getContext('2d'),name=document.querySelector('#name'),status=document.querySelector('#status');let stars=[],w=1000,h=440;const key='hoshi-atelier-v1';try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.stars)){stars=saved.stars.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&p.x>=0&&p.x<=1&&p.y>=0&&p.y<=1).slice(0,80);if(typeof saved.name==='string')name.value=saved.name.slice(0,24)}}catch(e){}
function persist(){try{localStorage.setItem(key,JSON.stringify({stars,name:name.value}))}catch(e){status.textContent='この環境では自動保存できません。画像保存をご利用ください。'}}
function paint(target,width,height,exporting=false){const g=target;g.fillStyle='#0d162d';g.fillRect(0,0,width,height);const glow=g.createRadialGradient(width*.65,height*.25,0,width*.65,height*.25,width*.7);glow.addColorStop(0,'#21365c');glow.addColorStop(1,'#0c1429');g.fillStyle=glow;g.fillRect(0,0,width,height);let seed=27;for(let i=0;i<160;i++){seed=(seed*16807)%2147483647;const x=(seed%10000)/10000*width;seed=(seed*16807)%2147483647;const y=(seed%10000)/10000*height;g.globalAlpha=.2+(i%4)*.1;g.fillStyle='#b6cdfc';g.beginPath();g.arc(x,y,i%6===0?1.2:.65,0,Math.PI*2);g.fill()}g.globalAlpha=1;if(stars.length){g.strokeStyle='#adc7fa';g.lineWidth=1.5;g.beginPath();stars.forEach((p,i)=>i?g.lineTo(p.x*width,p.y*height):g.moveTo(p.x*width,p.y*height));g.stroke();stars.forEach(p=>{let x=p.x*width,y=p.y*height;g.shadowBlur=18;g.shadowColor='#ffe3a0';g.fillStyle='#ffe6ab';g.beginPath();g.arc(x,y,4,0,Math.PI*2);g.fill();g.shadowBlur=0;g.strokeStyle='#ffedc6';g.beginPath();g.moveTo(x-8,y);g.lineTo(x+8,y);g.moveTo(x,y-8);g.lineTo(x,y+8);g.stroke()})}else if(!exporting){g.textAlign='center';g.fillStyle='#b7c7e3';g.font='15px system-ui';g.fillText('ここに、最初の星を。',width/2,height/2)}if(exporting){g.textAlign='center';g.fillStyle='#ffe6ab';g.font='24px system-ui';g.fillText(name.value.trim()||'名前のない星座',width/2,height-32);g.font='12px system-ui';g.fillStyle='#a5b9df';g.fillText('ほしのアトリエ',width/2,height-12)}}
function draw(){paint(ctx,w,h);document.querySelector('#count').textContent=stars.length+' 個の星';for(const id of ['undo','clear','save'])document.querySelector('#'+id).disabled=!stars.length}
function resize(){const box=c.getBoundingClientRect();w=box.width;h=box.height;const ratio=Math.min(devicePixelRatio||1,2);c.width=Math.round(w*ratio);c.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);draw()}
function update(message){status.textContent=message;persist();draw()}
c.addEventListener('pointerdown',e=>{if(stars.length>=80){status.textContent='この夜空には80個まで置けます。画像に保存して、新しい夜空へ。';return}const b=c.getBoundingClientRect();stars.push({x:Math.max(.02,Math.min(.98,(e.clientX-b.left)/b.width)),y:Math.max(.03,Math.min(.88,(e.clientY-b.top)/b.height))});update('星がひとつ、生まれました。')});
document.querySelector('#undo').onclick=()=>{stars.pop();update('ひとつ前の夜空に戻しました。')};document.querySelector('#clear').onclick=()=>{stars=[];update('新しい夜空です。')};document.querySelector('#random').onclick=()=>{const shapes=[[[.2,.62],[.32,.36],[.5,.22],[.67,.36],[.8,.62]],[[.26,.32],[.38,.22],[.55,.33],[.7,.24],[.77,.5],[.54,.68],[.26,.32]],[[.24,.3],[.45,.35],[.66,.27],[.73,.56],[.52,.64],[.45,.35]]];const titles=['ねむる山座','夜のこねこ座','空とぶティーカップ座'];const i=Math.floor(Math.random()*shapes.length);stars=shapes[i].map(([x,y])=>({x,y}));name.value=titles[i];update('おまかせ星座ができました。星を足しても遊べます。')};name.addEventListener('input',persist);
document.querySelector('#save').onclick=()=>{const out=document.createElement('canvas');out.width=1200;out.height=800;paint(out.getContext('2d'),1200,800,true);const a=document.createElement('a');a.download=(name.value.trim()||'星座').replace(/[\\/:*?"<>|]/g,'_')+'.png';a.href=out.toDataURL('image/png');a.click();status.textContent='星座の画像を保存しました。'};window.addEventListener('resize',resize);resize();})();
</script></html>
