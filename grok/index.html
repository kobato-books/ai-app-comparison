<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星空のメッセージ</title>
  
<meta property="og:type" content="website">
<meta property="og:title" content="星空のメッセージ">
<meta property="og:description" content="Grokが作った小さな宇宙アプリ">
<meta property="og:image" content="https://kobato-books.github.io/ai-app-comparison/grok/ogp.png">
<meta name="twitter:card" content="summary_large_image">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(160deg, #0b0b2b 0%, #1a1a4e 40%, #2a1a5e 100%);
      color: #e8e8ff;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    /* 星の背景 */
    .stars {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90px 40px, #fff, transparent),
        radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 160px 120px, #fff, transparent);
      background-size: 200px 200px;
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.6; }
      to { opacity: 1; }
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 30px;
      letter-spacing: 0.05em;
      text-shadow: 0 0 20px rgba(150, 180, 255, 0.6);
      z-index: 1;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      z-index: 1;
    }
    .message {
      font-size: 1.25rem;
      line-height: 1.7;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      transition: opacity 0.3s ease;
    }
    button {
      background: linear-gradient(135deg, #6b8cff, #9b6bff);
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 14px 36px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(107, 140, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(107, 140, 255, 0.5);
    }
    button:active {
      transform: translateY(0);
    }
    .footer {
      margin-top: 40px;
      font-size: 0.85rem;
      opacity: 0.6;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <h1>🌌 星空のメッセージ</h1>
  <div class="card">
    <div class="message" id="msg">ボタンを押して、<br>宇宙からのメッセージを受け取ろう</div>
    <button onclick="getMessage()">メッセージを受け取る</button>
  </div>
  <div class="footer">Grokが作った小さな宇宙アプリ</div>

  <script>
    const messages = [
      "あなたは星々のように、すでに十分輝いている。",
      "宇宙は広大だ。あなたの可能性も、同じくらい無限だ。",
      "今夜の空を見上げて。そこに、あなたの未来が少し映っている。",
      "たとえ小さくても、あなたの一歩は新しい星を生む。",
      "暗闇の中にこそ、一番きれいな光が見える。",
      "宇宙は急がない。あなたも、自分のペースでいい。",
      "今日という日は、136億年の歴史があなたに贈った贈り物だ。",
      "星は遠くに見えるけど、実はいつもあなたの心の中にある。",
      "失敗はただのブラックホール。向こう側には必ず光がある。",
      "あなたが息をするたびに、宇宙も少しだけ微笑む。"
    ];

    function getMessage() {
      const el = document.getElementById('msg');
      el.style.opacity = 0;
      setTimeout(() => {
        const random = messages[Math.floor(Math.random() * messages.length)];
        el.innerHTML = random;
        el.style.opacity = 1;
      }, 250);
    }
  </script>
</body>
</html>
