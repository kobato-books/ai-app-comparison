<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひと息リセット</title>
  
<meta property="og:type" content="website">
<meta property="og:title" content="ひと息リセット">
<meta property="og:description" content="無料版ChatGPTが考えて作ったWebアプリ">
<meta property="og:image" content="https://kobato-books.github.io/ai-app-comparison/chatgpt/ogp.png">
<meta name="twitter:card" content="summary_large_image">

<style>
:root{--green:#287653;--pale:#e0f2e8;--ink:#26332c;--muted:#68756d;--line:#e1e8e3}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f4faf6,#f8f7f1);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;padding:24px 14px}
main{max-width:620px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 12px 40px #254b3210}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--pale);border-radius:14px;padding:12px;font-size:25px}
h1{font-size:1.3rem;margin:0} .tag{font-size:.72rem;color:var(--muted);letter-spacing:.07em}
.sun{font-size:30px}
.hero{height:145px;border-radius:18px;background:linear-gradient(125deg,#cce8d6,#f3e9c9 58%,#9dc6a7);display:grid;place-items:center;overflow:hidden;position:relative;margin-bottom:22px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#ffffff55}
.hero:before{width:220px;height:220px;right:-20px;top:-100px}.hero:after{width:160px;height:160px;left:-30px;bottom:-110px}
.landscape{font-size:60px;filter:drop-shadow(0 6px 6px #2a593222);z-index:1}
h2{font-size:1.25rem;margin:0 0 6px}p{line-height:1.7}.sub{color:var(--muted);font-size:.92rem;margin:0 0 15px}
.moods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;color:var(--ink);transition:.15s}
button:focus-visible{outline:3px solid #91c9a8;outline-offset:2px}
.mood{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600}.mood .emoji{font-size:1.35rem}
.mood[aria-pressed="true"]{background:var(--pale);border-color:#62a783;color:#205c3c}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.section-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card{background:#f5f8f6;border-radius:18px;padding:20px}
.big-emoji{font-size:2.3rem;margin:0 0 5px}.activity-title{font-size:1.2rem;font-weight:750;margin:0 0 6px}.description{margin:0 0 16px}
.primary{background:var(--green);color:white;border-color:var(--green);font-weight:650;width:100%}
.secondary{width:100%;margin-top:9px;background:white}
.complete{display:none;color:#287653;font-weight:650;margin:12px 0 0}.complete.show{display:block}
.footer{text-align:center;color:var(--muted);font-size:.84rem;margin:18px 0 0}
.saved{margin-top:18px;border:1px dashed #b9cfc0;padding:12px;border-radius:14px;font-size:.9rem;color:var(--muted)}
@media(max-width:420px){main{padding:18px}.hero{height:120px}}
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><div class="logo">🌿</div><div><h1>ひと息リセット</h1><div class="tag">YOUR LITTLE MOMENT OF PEACE</div></div></div>
  <div class="sun" aria-hidden="true">☀️</div>
</header>
<div class="hero" role="img" aria-label="緑と陽だまりの穏やかな風景"><div class="landscape">🌳 🍃</div></div>
<h2>今、どんな気分？</h2>
<p class="sub">正解はないよ。今の自分に近いものを選んでね。</p>
<div class="moods" role="group" aria-label="気分を選択">
  <button class="mood" data-mood="つかれた" aria-pressed="true"><span class="emoji">😮‍💨</span>つかれた</button>
  <button class="mood" data-mood="もやもや" aria-pressed="false"><span class="emoji">🌧️</span>もやもや</button>
  <button class="mood" data-mood="げんき" aria-pressed="false"><span class="emoji">☀️</span>げんき</button>
  <button class="mood" data-mood="うれしい" aria-pressed="false"><span class="emoji">🥰</span>うれしい</button>
</div>
<hr>
<div class="section-title"><span>✨</span><h2>今日のおすすめ</h2></div>
<section class="card" aria-live="polite">
  <div class="big-emoji" id="activityEmoji">🌬️</div>
  <div class="activity-title" id="activityTitle">ゆっくり深呼吸</div>
  <p class="description" id="activityDescription">4秒かけて吸い、6秒かけて吐く。これを5回繰り返そう。</p>
  <button class="primary" id="doneButton">できた！ 🌱</button>
  <p class="complete" id="completeMessage">✓ できたね！ 自分をいたわる時間になりました。</p>
  <button class="secondary" id="nextButton">別のアイデアを見る ↻</button>
</section>
<div class="saved">💚 自分を大切にすることも、立派な一歩。</div>
<p class="footer">あなたのペースで、ひと息つこう。</p>
</main>
<script>
const ideas={
"つかれた":[["🌬️","ゆっくり深呼吸","4秒かけて吸い、6秒かけて吐く。これを5回繰り返そう。"],["☁️","何もしない1分","肩の力を抜いて、目を閉じてひと休み。"],["💧","水をひと口","水を飲んで、少しだけ体をいたわろう。"]],
"もやもや":[["📝","頭の中を書き出す","気になっていることを1つだけ、言葉にしてみよう。"],["🌳","窓の外を見る","遠くの景色を眺めて、意識を今ここに戻そう。"],["🍃","心配をひと休み","今すぐ解決しなくていいことを、1分だけ手放そう。"]],
"げんき":[["✨","小さな一歩","後回しにしていたことを、1分だけ進めてみよう。"],["💌","誰かにひとこと","大切な人に、短いメッセージを送ってみよう。"],["🎯","今日の楽しみ","今日、自分が楽しみにできることを1つ決めよう。"]],
"うれしい":[["🌸","幸せを味わう","今うれしいと感じている理由を、心の中で言葉にしよう。"],["📸","思い出を残す","今の気持ちを写真やメモに残してみよう。"],["💖","自分をほめる","今日の自分のいいところを、1つ見つけよう。"]]
};
let mood="つかれた",index=0,done=false;
const $=id=>document.getElementById(id);
function render(){
 const a=ideas[mood][index%3];
 $("activityEmoji").textContent=a[0];$("activityTitle").textContent=a[1];$("activityDescription").textContent=a[2];
 $("doneButton").textContent=done?"もう一度やってみる":"できた！ 🌱";
 $("completeMessage").classList.toggle("show",done);
 document.querySelectorAll("[data-mood]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mood===mood)));
}
document.querySelectorAll("[data-mood]").forEach(b=>b.addEventListener("click",()=>{mood=b.dataset.mood;index=0;done=false;render()}));
$("doneButton").addEventListener("click",()=>{done=!done;render()});
$("nextButton").addEventListener("click",()=>{index++;done=false;render()});
render();
</script>
</body>
</html>
